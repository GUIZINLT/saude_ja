# Verifica o projeto a cada push e pull request:
# formatação, análise estática, testes e build web.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Formatação, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test tool screenshots

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build web
        run: flutter build web
