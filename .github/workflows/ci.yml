# Verifica o projeto a cada push e pull request: formatação, análise
# estática, testes (app e design system), cobertura, build web e testes
# visuais dos componentes.
#
# Com --reporter github, cada teste que falha vira um aviso na execução,
# com o nome do teste e o erro (visível sem login no GitHub).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Formatação, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Baixar dependências (app e design system)
        run: |
          flutter pub get
          flutter pub get --directory packages/saude_ja_design_system

      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test tool screenshots packages

      - name: Análise estática
        run: flutter analyze

      # Os testes visuais rodam no job do Windows (abaixo).
      - name: Testes do app (com cobertura)
        run: >-
          flutter test --coverage --exclude-tags golden --reporter github
          --file-reporter expanded:test-report.txt

      # Os detalhes de uma falha (logs) só aparecem para quem está logado no
      # GitHub. Este passo publica o trecho do erro como aviso, que é
      # visível para qualquer pessoa.
      - name: Detalhes das falhas dos testes
        if: failure()
        run: |
          [ -f test-report.txt ] || exit 0
          grep -n -E -A40 "\[E\]|EXCEPTION CAUGHT|Bad state|Error:" test-report.txt \
            | head -120 > falhas.txt || true
          # Quebras de linha viram %0A para caber num único aviso.
          msg=$(tr -d '\r' < falhas.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Detalhes das falhas::${msg}"

      - name: Testes do design system (contraste e demais)
        working-directory: packages/saude_ja_design_system
        run: flutter test --exclude-tags golden --reporter github

      - name: Resumo da cobertura (mínimo de 85%)
        run: dart run tool/coverage_summary.dart --min 85 >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web

  testes-visuais:
    # As imagens de referência são geradas no Windows, e cada sistema
    # desenha bordas e texto com pequenas diferenças de pixel. Por isso a
    # comparação roda num Windows também.
    name: Testes visuais (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Baixar dependências
        working-directory: packages/saude_ja_design_system
        run: flutter pub get

      - name: Testes visuais dos componentes (claro e escuro)
        working-directory: packages/saude_ja_design_system
        run: flutter test test/golden --reporter github

      - name: Guardar diferenças dos testes visuais
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-visuais-falhas
          path: packages/saude_ja_design_system/test/golden/failures/
          if-no-files-found: ignore
